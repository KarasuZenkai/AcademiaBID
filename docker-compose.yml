services:
  postgres:
    image: postgres:16
    container_name: academia-bid-postgres
    environment:
      POSTGRES_DB: academia_bid
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: academia_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia_bid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
